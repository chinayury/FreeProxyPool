name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 控制台默认 cp1252，selftest 输出中文会触发 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装项目与开发依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI 冒烟（--version / version）
        run: |
          freeproxypool --version
          freeproxypool version

      - name: 离线自检（全量回归门禁）
        run: python -m freeproxypool selftest

  package:
    name: build wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 校验 wheel 可安装且版本正确
        run: |
          pip install dist/*.whl
          freeproxypool --version
          python -c "import freeproxypool; assert freeproxypool.__version__ == open('VERSION').read().strip(), freeproxypool.__version__"

      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          retention-days: 1

  docker:
    name: docker compose smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 准备 .env（CI 专用随机凭据，不入库）
        run: |
          printf 'API_KEY=%s\n' "$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')" >> .env
          printf 'ADMIN_PASSWORD=Fp#%s\n' "$(python3 -c 'import secrets;print(secrets.token_urlsafe(14))')" >> .env
          printf 'REDIS_PASSWORD=%s\n' "$(python3 -c 'import secrets;print(secrets.token_urlsafe(16))')" >> .env

      - name: 构建并启动全栈（compose build 内含自检门禁）
        run: docker compose up -d --build redis gateway nginx

      - name: 健康检查（/health/live）
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5020/health/live; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            docker compose logs --tail=100
            exit 1
          fi
          curl -fsS http://127.0.0.1:5020/version
