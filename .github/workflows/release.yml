name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

env:
  # ghcr.io 要求镜像路径全小写
  IMAGE: ghcr.io/${{ github.repository_owner }}/freeproxypool

jobs:
  package:
    name: build wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          retention-days: 1

  docker:
    name: build & push GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号（去掉 tag 前缀 v）
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像（latest + 当前版本，单平台单清单）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

  release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist

      - name: 创建 Release 并上传当前版本产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "FreeProxyPool ${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  cleanup:
    name: purge old artifacts (keep latest only)
    runs-on: ubuntu-latest
    needs: [release, docker]
    steps:
      - uses: actions/checkout@v4

      - name: 删除旧 Release 的附件（保留 Release 记录）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ github.ref_name }}"
          for tag in $(gh release list --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$current" ]; then
              echo "清理旧 Release $tag 的附件…"
              gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
                gh release delete-asset "$tag" "$asset" --yes || true
              done
            fi
          done

      - name: 清理旧 GHCR 镜像版本（只留 latest 与当前版本）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ github.ref_name#v }}"
          owner="${{ github.repository_owner }}"
          api="https://api.github.com/users/$owner/packages/container/freeproxypool/versions?per_page=100"
          total=0
          for id in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api" \
              | jq -r --arg cur "$current" \
              '.[] | select((.metadata.container.tags | map(select(. == "latest" or . == $cur)) | length) == 0) | .id'); do
            echo "删除 GHCR 版本 $id"
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/users/$owner/packages/container/freeproxypool/versions/$id"
            total=$((total+1))
          done
          echo "已删除 $total 个旧镜像版本"

      - name: 清理历史 Actions artifacts（保留当前 run）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          current_run="${{ github.run_id }}"
          for a in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/artifacts?per_page=100" \
              | jq -r --arg cur "$current_run" '.artifacts[] | select(.workflow_run.id != ($cur|tonumber)) | .id'); do
            echo "删除历史 artifact $a"
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/artifacts/$a"
          done
