name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  package:
    name: build wheel & sdist
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          retention-days: 1

  docker:
    name: build and push GHCR image
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image and version (tag ref, else VERSION file)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freeproxypool" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (latest + current version)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

  release:
    name: create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "FreeProxyPool ${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  cleanup:
    name: purge old artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [release, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Delete old release assets (keep release records)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ github.ref_name }}"
          for tag in $(gh release list --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$current" ]; then
              echo "purge assets of old release $tag"
              gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
                gh release delete-asset "$tag" "$asset" --yes || true
              done
            fi
          done

      - name: Delete stale GHCR versions (keep latest and current)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ github.ref_name#v }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          api="https://api.github.com/users/$owner/packages/container/freeproxypool/versions?per_page=100"
          total=0
          for id in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api" \
              | jq -r --arg cur "$current" \
              '.[] | select((.metadata.container.tags | map(select(. == "latest" or . == $cur)) | length) == 0) | .id'); do
            echo "delete GHCR version $id"
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/users/$owner/packages/container/freeproxypool/versions/$id"
            total=$((total+1))
          done
          echo "deleted $total old image versions"

      - name: Delete old workflow artifacts (keep current run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          current_run="${GITHUB_RUN_ID}"
          for a in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/artifacts?per_page=100" \
              | jq -r --arg cur "$current_run" '.artifacts[] | select(.workflow_run.id != ($cur|tonumber)) | .id'); do
            echo "delete stale artifact $a"
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/artifacts/$a"
          done
