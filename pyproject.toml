[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeproxypool"
version = "0.1.1"
description = "免费代理 IP 池系统：采集 / 验证 / 分发"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "FreeProxyPool" }]
keywords = ["proxy", "proxy-pool", "scraper", "fastapi", "redis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "starlette>=1.3.1,<2.0",
    "pydantic>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "aiohttp>=3.10,<4.0",
    "aiohttp-socks>=0.10,<1.0",
    "requests>=2.32,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "PyMySQL>=1.1,<2.0",
    "APScheduler>=3.10,<4.0",
    "prometheus-client>=0.20,<1.0",
    "click>=8.1,<9.0",
    "tzdata>=2024.1",
    "maxminddb>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pip-audit>=2.7,<3.0",
]

[project.scripts]
freeproxypool = "freeproxypool.proxyPool:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freeproxypool = ["admin/templates/*.html"]
