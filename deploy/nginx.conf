# FreeProxyPool 统一入口（Nginx）
#
# 拓扑：
#   客户端 → nginx:80 → gateway:5020（可多副本）

resolver 127.0.0.11 valid=30s ipv6=off;

upstream fpp_gateway {
    zone fpp_gateway 64k;
    # resolve 让 Nginx 在运行时动态解析 gateway 服务名，
    # `docker compose up -d --scale gateway=3` 后自动轮询各副本
    server gateway:5020 resolve;
    keepalive 32;
}

# ---- 限流区：按客户端 IP 兜底，避免把应用层打满 ----
limit_req_zone $binary_remote_addr zone=fpp_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=fpp_admin:10m rate=5r/s;

# ---- 连接与体积上限 ----
limit_conn_zone $binary_remote_addr zone=fpp_conn:10m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ---------- 管理后台：更严格的限流 + 仅允许内网来源 ----------
    location /admin {
        limit_req zone=fpp_admin burst=10 nodelay;
        limit_conn fpp_conn 20;
        proxy_pass http://fpp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------- 代理池 API ----------
    location / {
        limit_req zone=fpp_api burst=60 nodelay;
        limit_conn fpp_conn 50;
        proxy_pass http://fpp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 关键：必须透传 X-Forwarded-For，应用层（且仅在 TRUSTED_PROXIES
        # 命中时）会据此识别真实客户端 IP 与执行登录爆破锁定
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}